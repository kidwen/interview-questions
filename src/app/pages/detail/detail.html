<div class="detail-container">
  <!-- Left Sidebar Menu -->
  <aside class="sidebar">
    <ul class="menu-list">
      @for (item of menuItems(); track $index) {
      <li [class.active]="selectedMenuId() === item.id" (click)="selectMenu(item.id)">
        {{ $index + 1 }}. {{ item.label }}
      </li>
      }
    </ul>
  </aside>

  <!-- Right Content Area -->
  <section class="content-area">
    @if (selectedMenuId()) {
    <button class="refresh-btn" (click)="refreshAnswer()" [disabled]="isLoading()" title="刷新回答">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"
        />
      </svg>
    </button>
    }

    <div class="html-renderer" [innerHTML]="selectedContent()"></div>
  </section>
</div>
