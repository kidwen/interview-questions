@if (isOpen()) {
  <div class="modal-overlay" (click)="close()">
    <div class="modal-container" (click)="stopPropagation($event)">
      <button class="close-btn" (click)="close()">×</button>

      <div class="modal-header">
        <div
          class="tab"
          [class.active]="isLoginMode()"
          (click)="isLoginMode.set(true)"
        >
          登录
        </div>
        <div
          class="tab"
          [class.active]="!isLoginMode()"
          (click)="isLoginMode.set(false)"
        >
          注册
        </div>
      </div>

      <div class="modal-body">
        @if (!isLoginMode()) {
          <div class="form-group">
            <label>用户名</label>
            <input
              type="text"
              [ngModel]="username()"
              (ngModelChange)="username.set($event)"
              placeholder="请输入用户名"
              (keyup.enter)="submit()"
              [disabled]="isLoading()"
            >
          </div>
        }

        <!-- Login needs Email, not Username -->
        <div class="form-group">
          <label>邮箱</label>
          <input
            type="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            placeholder="请输入邮箱"
            (keyup.enter)="submit()"
            [disabled]="isLoading()"
          >
        </div>

        <div class="form-group">
          <label>密码</label>
          <input
            type="password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            placeholder="请输入密码"
            (keyup.enter)="submit()"
            [disabled]="isLoading()"
          >
        </div>

        @if (!isLoginMode()) {
          <div class="form-group">
            <label>确认密码</label>
            <input
              type="password"
              [ngModel]="confirmPassword()"
              (ngModelChange)="confirmPassword.set($event)"
              placeholder="请再次输入密码"
              (keyup.enter)="submit()"
              [disabled]="isLoading()"
            >
          </div>
        }

        @if (errorMessage()) {
          <div class="error-message" style="color: red; margin-bottom: 10px; font-size: 0.9rem;">
            {{ errorMessage() }}
          </div>
        }

        <button class="submit-btn" (click)="submit()" [disabled]="isLoading()">
          {{ isLoading() ? '处理中...' : (isLoginMode() ? '立即登录' : '注册账号') }}
        </button>

        <div class="toggle-link">
          @if (isLoginMode()) {
            没有账号？<span (click)="toggleMode()">去注册</span>
          } @else {
            已有账号？<span (click)="toggleMode()">去登录</span>
          }
        </div>
      </div>
    </div>
  </div>
}
