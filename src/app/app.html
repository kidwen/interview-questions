<div class="layout">
  <!-- Particle Background -->
  <div class="particles">
    <span></span><span></span><span></span><span></span><span></span> <span></span><span></span
    ><span></span><span></span><span></span> <span></span><span></span><span></span><span></span
    ><span></span>
  </div>

  <!-- Top Navigation -->
  <header class="navbar">
    <div class="nav-content">
      <button class="home-btn" routerLink="/"><span class="icon">🏠</span> Home</button>

      <div class="nav-actions">
        <button
          class="theme-btn"
          (click)="toggleTheme()"
          [title]="isDarkMode() ? 'Switch to Light' : 'Switch to Dark'"
        >
          {{ isDarkMode() ? '☀️' : '🌙' }}
        </button>

        <a
          href="https://github.com/kidwen/interview-questions"
          target="_blank"
          class="github-link"
          title="View on GitHub"
        >
          <svg height="24" width="24" viewBox="0 0 16 16" fill="currentColor">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
            ></path>
          </svg>
        </a>

        @if (authService.isLoggedIn()) {
        <div class="avatar-wrapper">
          <button class="avatar-btn">
            <img
              [src]="
                'https://ui-avatars.com/api/?name=' +
                (authService.currentUser()?.username || 'User') +
                '&background=random'
              "
              alt="Avatar"
            />
          </button>
          <div class="avatar-dropdown">
            <button class="logout-btn" routerLink="/prompts">我的提示词</button>
            <button class="logout-btn" (click)="authService.logout()">退出登录</button>
          </div>
        </div>
        } @else {
        <button class="login-btn" (click)="authModal.open()">Login</button>
        }
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <router-outlet></router-outlet>
  </main>

  <app-auth-modal #authModal></app-auth-modal>
</div>
